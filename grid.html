<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Spatial Canvas - Canvas of Truth</title>
    <style>
        :root {
            --green: #00ff66;
            --green-soft: #6cff9a;
            --bg: #000000;
            --panel: rgba(0, 0, 0, 0.78);
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--green);
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
        }

        #spatial-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 102, 0.04), transparent 35%),
                radial-gradient(circle at 80% 75%, rgba(0, 255, 102, 0.03), transparent 40%),
                #020402;
            cursor: grab;
        }

        #spatial-canvas.dragging {
            cursor: grabbing;
        }

        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.45));
            border-bottom: 1px solid rgba(0, 255, 102, 0.25);
            padding: 12px 18px 14px;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--green);
            display: inline-block;
            padding-bottom: 4px;
            pointer-events: auto;
        }

        .nav {
            margin-top: 10px;
            pointer-events: auto;
        }

        .nav a {
            color: var(--green);
            text-decoration: none;
            border-bottom: 1px dashed var(--green);
            margin-right: 12px;
            font-weight: bold;
        }

        .nav a:hover {
            color: #ffffff;
            border-bottom: 1px solid #ffffff;
        }

        .description {
            margin: 10px 0 0;
            font-size: 0.86rem;
            color: var(--green-soft);
            pointer-events: auto;
        }

        #loading {
            position: fixed;
            top: 122px;
            left: 18px;
            z-index: 5;
            background: var(--panel);
            border: 1px solid rgba(0, 255, 102, 0.5);
            padding: 6px 10px;
            font-size: 0.82rem;
        }

        #canvas-instruction {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(0, 255, 102, 0.35);
            padding: 8px 12px;
            color: #7cbf8f;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
            text-align: center;
            pointer-events: none;
        }

        #tooltip {
            position: fixed;
            background-color: rgba(0, 0, 0, 0.92);
            border: 1px solid var(--green);
            box-shadow: 0 0 14px rgba(0, 255, 102, 0.35);
            padding: 10px;
            max-width: 320px;
            display: none;
            z-index: 10;
            pointer-events: none;
            word-wrap: break-word;
            font-size: 0.88rem;
            line-height: 1.28;
        }

        .tooltip-header {
            font-size: 0.8em;
            color: #99d3aa;
            margin-bottom: 6px;
            border-bottom: 1px dashed #2f4f37;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <canvas id="spatial-canvas"></canvas>

    <div class="hud">
        <h1>Canvas of Truth</h1>
        <div class="nav">
            <a href="index.html">The Feed</a>
            <a href="grid.html">The Spatial Canvas</a>
            <a href="about.html">The Philosophy</a>
        </div>
        <p class="description">Marks are placed on the canvas deterministically based on their cryptographic hash.</p>
    </div>

    <div id="loading">Syncing with origin...</div>
    <div id="canvas-instruction">Drag to pan. Scroll to zoom. Dbl-Click to send a sonar ping. Click a mark to verify.</div>

    <div id="tooltip">
        <div class="tooltip-header" id="tooltip-author"></div>
        <div id="tooltip-body"></div>
    </div>

    <script>
        const canvas = document.getElementById('spatial-canvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        const tooltipAuthor = document.getElementById('tooltip-author');
        const tooltipBody = document.getElementById('tooltip-body');
        const loadingEl = document.getElementById('loading');

        const camera = {
            offsetX: 0,
            offsetY: 0,
            zoomLevel: 0.06
        };

        const MIN_ZOOM = 0.015;
        const MAX_ZOOM = 2.4;
        const HOVER_DISTANCE_PX = 15;
        const MINIMAP_SIZE = 150;
        const MINIMAP_PADDING = 20;
        const MINIMAP_WORLD_MIN = -12000;
        const MINIMAP_WORLD_MAX = 12000;
        const MINIMAP_WORLD_SPAN = MINIMAP_WORLD_MAX - MINIMAP_WORLD_MIN;
        const DUST_WIND_STRENGTH = 0.45;

        let marks = [];
        let hoveredMark = null;
        let mouseX = 0;
        let mouseY = 0;
        let isDragging = false;
        let dragMoved = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let initialPinchDistance = null;
        let initialPinchZoom = null;
        let audioContext = null;
        let currentOscillator = null;
        let currentGainNode = null;
        let activeScanWaves = [];
        let activePackets = [];
        let edges = [];
        const WAVE_SPEED = 250;
        const WAVE_MAX_RADIUS = 15000;

        
        function spawnScanWave(worldX, worldY) {
            ensureAudioContext();
            activeScanWaves.push({
                x: worldX,
                y: worldY,
                radius: 0,
                maxRadius: WAVE_MAX_RADIUS,
                speed: WAVE_SPEED,
                active: true
            });
            
            // Play a low frequency "ping" sound
            if (audioContext) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(40, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioContext.currentTime + 1.5);
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1.5);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 1.6);
            }
        }

        function ensureAudioContext() {
            if (!audioContext) {
                const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextCtor) {
                    return null;
                }
                audioContext = new AudioContextCtor();
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume().catch(() => {
                    // Resume can fail without a user gesture; retry on next interaction.
                });
            }

            return audioContext;
        }

        function stopSound() {
            if (!audioContext || !currentOscillator || !currentGainNode) {
                return;
            }

            const now = audioContext.currentTime;
            const stopAt = now + 0.14;

            currentGainNode.gain.cancelScheduledValues(now);
            currentGainNode.gain.setValueAtTime(Math.max(currentGainNode.gain.value, 0.0001), now);
            currentGainNode.gain.exponentialRampToValueAtTime(0.0001, stopAt);

            try {
                currentOscillator.stop(stopAt + 0.01);
            } catch (error) {
                // Oscillator might already be stopped.
            }

            currentOscillator = null;
            currentGainNode = null;
        }

        function playMarkSound(hashHex) {
            const context = ensureAudioContext();
            if (!context) {
                return;
            }

            stopSound();

            const hashPrefix = (hashHex || '').slice(0, 8);
            const hashInt = Number.parseInt(hashPrefix, 16);
            const normalized = Number.isFinite(hashInt) ? (hashInt / 0xFFFFFFFF) : 0.5;
            const frequency = 150 + (normalized * 450);

            const oscillator = context.createOscillator();
            const gainNode = context.createGain();

            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(frequency, context.currentTime);

            const now = context.currentTime;
            gainNode.gain.setValueAtTime(0.0001, now);
            gainNode.gain.exponentialRampToValueAtTime(0.12, now + 0.06);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

            oscillator.connect(gainNode);
            gainNode.connect(context.destination);

            oscillator.onended = () => {
                try {
                    oscillator.disconnect();
                    gainNode.disconnect();
                } catch (error) {
                    // Nodes may already be disconnected.
                }

                if (currentOscillator === oscillator) {
                    currentOscillator = null;
                    currentGainNode = null;
                }
            };

            oscillator.start(now);
            oscillator.stop(now + 0.82);

            currentOscillator = oscillator;
            currentGainNode = gainNode;
        }

        function extractHash(body) {
            const match = body.match(/Hash:\s*([a-f0-9]{64})/i);
            return match ? match[1] : null;
        }

        function hashToCoords(hashHex) {
            if (!hashHex) {
                return {
                    x: (Math.random() * 20000) - 10000,
                    y: (Math.random() * 20000) - 10000
                };
            }

            const xSub = hashHex.substring(0, 8);
            const ySub = hashHex.substring(8, 16);
            const xInt = parseInt(xSub, 16);
            const yInt = parseInt(ySub, 16);

            const xNorm = xInt / 0xFFFFFFFF;
            const yNorm = yInt / 0xFFFFFFFF;

            return {
                x: (xNorm * 20000) - 10000,
                y: (yNorm * 20000) - 10000
            };
        }

        function hashToHue(hashHex) {
            if (!hashHex || hashHex.length < 20) {
                return 120;
            }

            const hueSub = hashHex.substring(16, 20);
            const hueInt = Number.parseInt(hueSub, 16);

            if (!Number.isFinite(hueInt)) {
                return 120;
            }

            return (hueInt / 0xFFFF) * 360;
        }

        function cleanCommentBody(body) {
            const match = body.match(/---\s*BEGIN VERIFIED MARK\s*---[\s\S]*?Timestamp:[^\n]*\n([\s\S]*?)---\s*END VERIFIED MARK\s*---/);
            return (match && match[1]) ? match[1].trim() : body;
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const width = Math.floor(window.innerWidth);
            const height = Math.floor(window.innerHeight);

            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        
        function worldToScreenParallax(worldX, worldY, parallaxFactor) {
            return {
                x: (worldX - (camera.offsetX * parallaxFactor)) * camera.zoomLevel + (canvas.clientWidth / 2),
                y: (worldY - (camera.offsetY * parallaxFactor)) * camera.zoomLevel + (canvas.clientHeight / 2)
            };
        }

        function worldToScreen(worldX, worldY) {
            return {
                x: (worldX - camera.offsetX) * camera.zoomLevel + (canvas.clientWidth / 2),
                y: (worldY - camera.offsetY) * camera.zoomLevel + (canvas.clientHeight / 2)
            };
        }

        function screenToWorld(screenX, screenY) {
            return {
                x: ((screenX - (canvas.clientWidth / 2)) / camera.zoomLevel) + camera.offsetX,
                y: ((screenY - (canvas.clientHeight / 2)) / camera.zoomLevel) + camera.offsetY
            };
        }

        function getNodeRadiusPx() {
            return Math.max(3, Math.min(10, 3 + (camera.zoomLevel * 11)));
        }

        function drawBackgroundGrid() {
            const spacingWorld = 1000;
            const topLeft = screenToWorld(0, 0);
            const bottomRight = screenToWorld(canvas.clientWidth, canvas.clientHeight);

            const startX = Math.floor(topLeft.x / spacingWorld) * spacingWorld;
            const endX = Math.ceil(bottomRight.x / spacingWorld) * spacingWorld;
            const startY = Math.floor(topLeft.y / spacingWorld) * spacingWorld;
            const endY = Math.ceil(bottomRight.y / spacingWorld) * spacingWorld;

            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
            ctx.beginPath();

            for (let x = startX; x <= endX; x += spacingWorld) {
                const sx = worldToScreen(x, 0).x;
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, canvas.clientHeight);
            }

            for (let y = startY; y <= endY; y += spacingWorld) {
                const sy = worldToScreen(0, y).y;
                ctx.moveTo(0, sy);
                ctx.lineTo(canvas.clientWidth, sy);
            }

            ctx.stroke();
        }

        function drawNode(mark, isHovered, scanIntensity = 0) {
            const s = worldToScreen(mark.x, mark.y);
            const baseRadius = getNodeRadiusPx();
            const radius = isHovered ? baseRadius * 1.3 : baseRadius;
            const hue = Number.isFinite(mark.hue) ? mark.hue : 120;
            const intensityBonus = scanIntensity * 1.5; // Up to 150% extra brightness
            
            // Adjust lightness based on scan
            const baseLightness = 50;
            const currentLightness = Math.min(100, baseLightness + (intensityBonus * 50));
            const alphaBoost = scanIntensity * 0.4;

            const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, radius * 4.8);
            glow.addColorStop(0, isHovered ? 'rgba(255, 255, 255, 0.8)' : `hsla(${hue}, 100%, ${currentLightness}%, ${0.52 + alphaBoost})`);
            glow.addColorStop(0.35, isHovered ? `hsla(${hue}, 100%, 68%, 0.5)` : `hsla(${hue}, 100%, ${Math.min(100, currentLightness - 10)}%, ${0.2 + (alphaBoost/2)})`);
            glow.addColorStop(1, `hsla(${hue}, 100%, 50%, 0)`);

            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(s.x, s.y, radius * 4.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = isHovered ? '#ffffff' : `hsla(${hue}, 100%, 50%, 0.95)`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, radius * 0.55, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = isHovered ? `hsla(${hue}, 100%, 86%, 0.9)` : `hsla(${hue}, 100%, 50%, 0.72)`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, radius * 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = isHovered ? `hsla(${hue}, 100%, 78%, 0.6)` : `hsla(${hue}, 100%, 50%, 0.45)`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, radius * 2.3, 0, Math.PI * 2);
            ctx.fill();
        }

        
        const nebulas = Array.from({ length: 40 }, () => ({
            x: (Math.random() * 40000) - 20000,
            y: (Math.random() * 40000) - 20000,
            radius: 2000 + (Math.random() * 6000),
            hue: Math.floor(Math.random() * 360),
            opacity: 0.03 + (Math.random() * 0.08),
            parallaxFactor: 0.2 + (Math.random() * 0.6)
        }));

        const dust = Array.from({ length: 300 }, () => ({
            x: (Math.random() * 50000) - 25000,
            y: (Math.random() * 50000) - 25000,
            baseVx: (Math.random() * 6) - 3,
            baseVy: (Math.random() * 6) - 3,
            vx: 0,
            vy: 0,
            size: 0.5 + (Math.random() * 2),
            opacity: 0.1 + (Math.random() * 0.4)
        })).map((particle) => ({
            ...particle,
            vx: particle.baseVx,
            vy: particle.baseVy
        }));

        function getMinimapRect() {
            return {
                left: canvas.clientWidth - MINIMAP_SIZE - MINIMAP_PADDING,
                top: canvas.clientHeight - MINIMAP_SIZE - MINIMAP_PADDING,
                size: MINIMAP_SIZE
            };
        }

        function worldToMinimap(value) {
            return ((value - MINIMAP_WORLD_MIN) / MINIMAP_WORLD_SPAN) * MINIMAP_SIZE;
        }

        function minimapToWorld(value) {
            return MINIMAP_WORLD_MIN + ((value / MINIMAP_SIZE) * MINIMAP_WORLD_SPAN);
        }

        function getMinimapWorldAtScreen(screenX, screenY) {
            const minimap = getMinimapRect();
            const localX = screenX - minimap.left;
            const localY = screenY - minimap.top;
            if (localX < 0 || localX > minimap.size || localY < 0 || localY > minimap.size) {
                return null;
            }
            return {
                x: minimapToWorld(localX),
                y: minimapToWorld(localY)
            };
        }

        function drawMinimap() {
            const minimap = getMinimapRect();
            const mapSize = minimap.size;
            const mapLeft = minimap.left;
            const mapTop = minimap.top;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(mapLeft, mapTop, mapSize, mapSize);
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
            ctx.lineWidth = 1;
            ctx.strokeRect(mapLeft, mapTop, mapSize, mapSize);

            ctx.fillStyle = 'rgba(0, 255, 102, 0.8)';
            for (const mark of marks) {
                const mx = mapLeft + worldToMinimap(mark.x);
                const my = mapTop + worldToMinimap(mark.y);
                ctx.fillRect(mx, my, 1, 1);
            }

            const topLeftWorld = screenToWorld(0, 0);
            const bottomRightWorld = screenToWorld(canvas.clientWidth, canvas.clientHeight);
            const viewX = mapLeft + worldToMinimap(topLeftWorld.x);
            const viewY = mapTop + worldToMinimap(topLeftWorld.y);
            const viewW = worldToMinimap(bottomRightWorld.x) - worldToMinimap(topLeftWorld.x);
            const viewH = worldToMinimap(bottomRightWorld.y) - worldToMinimap(topLeftWorld.y);

            ctx.save();
            ctx.beginPath();
            ctx.rect(mapLeft, mapTop, mapSize, mapSize);
            ctx.clip();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;
            ctx.strokeRect(viewX, viewY, viewW, viewH);
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
            
            // Draw nebulas (parallax background)
            ctx.globalCompositeOperation = 'lighter';
            for (const nebula of nebulas) {
                const s = worldToScreenParallax(nebula.x, nebula.y, nebula.parallaxFactor);
                const sRadius = nebula.radius * camera.zoomLevel;
                
                // Culling
                if (s.x + sRadius < 0 || s.x - sRadius > canvas.clientWidth || s.y + sRadius < 0 || s.y - sRadius > canvas.clientHeight) continue;
                
                const gradient = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sRadius);
                gradient.addColorStop(0, `hsla(${nebula.hue}, 80%, 40%, ${nebula.opacity})`);
                gradient.addColorStop(0.5, `hsla(${nebula.hue}, 70%, 25%, ${nebula.opacity * 0.5})`);
                gradient.addColorStop(1, `hsla(${nebula.hue}, 60%, 15%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(s.x, s.y, sRadius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';

            drawBackgroundGrid();
            const mouseWorld = screenToWorld(mouseX, mouseY);
            const repelDistance = 250 / camera.zoomLevel;
            const t = Date.now();
            const windX = Math.sin(t / 10000) * DUST_WIND_STRENGTH;
            const windY = Math.cos(t / 12000) * DUST_WIND_STRENGTH;

            for (const particle of dust) {
                const dx = particle.x - mouseWorld.x;
                const dy = particle.y - mouseWorld.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 0 && dist < repelDistance) {
                    particle.vx += (dx / dist) * 2;
                    particle.vy += (dy / dist) * 2;
                }

                particle.vx += ((particle.baseVx + windX) - particle.vx) * 0.05;
                particle.vy += ((particle.baseVy + windY) - particle.vy) * 0.05;
                particle.x += particle.vx;
                particle.y += particle.vy;

                if (particle.x > 25000) particle.x = -25000;
                if (particle.x < -25000) particle.x = 25000;
                if (particle.y > 25000) particle.y = -25000;
                if (particle.y < -25000) particle.y = 25000;

                const s = worldToScreen(particle.x, particle.y);
                ctx.fillStyle = `rgba(0, 255, 102, ${particle.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
            }

            
            // Update and draw scan waves
            for (let i = activeScanWaves.length - 1; i >= 0; i--) {
                const wave = activeScanWaves[i];
                wave.radius += wave.speed;
                
                if (wave.radius > wave.maxRadius) {
                    activeScanWaves.splice(i, 1);
                    continue;
                }
                
                const s = worldToScreen(wave.x, wave.y);
                const screenRadius = wave.radius * camera.zoomLevel;
                const alpha = Math.max(0, 1 - (wave.radius / wave.maxRadius));
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, screenRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 102, ${alpha * 0.8})`;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, screenRadius - 5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 102, ${alpha * 0.3})`;
                ctx.lineWidth = 8;
                ctx.stroke();
            }

            // Draw constellation lines
            for (const edge of edges) {
                const a = worldToScreen(edge.source.x, edge.source.y);
                const b = worldToScreen(edge.target.x, edge.target.y);
                const alpha = (1 - (edge.distance / 9000)) * 0.45;
                const hueA = Number.isFinite(edge.source.hue) ? edge.source.hue : 120;
                const hueB = Number.isFinite(edge.target.hue) ? edge.target.hue : 120;
                const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
                gradient.addColorStop(0, `hsla(${hueA}, 100%, 50%, ${alpha})`);
                gradient.addColorStop(1, `hsla(${hueB}, 100%, 50%, ${alpha})`);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            }

            // Spawn and render data packets
            if (edges.length > 0 && Math.random() < 0.15) {
                const edge = edges[Math.floor(Math.random() * edges.length)];
                const isReverse = Math.random() > 0.5;
                activePackets.push({
                    from: isReverse ? edge.target : edge.source,
                    to: isReverse ? edge.source : edge.target,
                    progress: 0,
                    speed: (0.005 + Math.random() * 0.01) * (9000 / Math.max(100, edge.distance))
                });
            }

            for (let i = activePackets.length - 1; i >= 0; i--) {
                const packet = activePackets[i];
                packet.progress += packet.speed;
                if (packet.progress >= 1) {
                    activePackets.splice(i, 1);
                    continue;
                }
                
                const curX = packet.from.x + (packet.to.x - packet.from.x) * packet.progress;
                const curY = packet.from.y + (packet.to.y - packet.from.y) * packet.progress;
                const s = worldToScreen(curX, curY);
                
                const hue = Number.isFinite(packet.from.hue) ? packet.from.hue : 120;
                ctx.fillStyle = `hsla(${hue}, 100%, 80%, 1)`;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, 1)`;
                ctx.shadowBlur = 15 * camera.zoomLevel;
                ctx.beginPath();
                ctx.arc(s.x, s.y, Math.max(1.5, 3 * camera.zoomLevel), 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            for (const mark of marks) {
                let scanIntensity = 0;
                for (const wave of activeScanWaves) {
                    const dist = Math.hypot(mark.x - wave.x, mark.y - wave.y);
                    const diff = Math.abs(dist - wave.radius);
                    const waveWidth = 800; // World units width of the wave effect
                    
                    if (diff < waveWidth) {
                        const intensity = 1 - (diff / waveWidth);
                        scanIntensity = Math.max(scanIntensity, intensity * (1 - wave.radius/wave.maxRadius));
                        
                        // Play a tiny ping if hit dead on
                        if (diff < wave.speed && audioContext && Math.random() > 0.5) {
                             const osc = audioContext.createOscillator();
                             const gain = audioContext.createGain();
                             osc.type = 'sine';
                             const hashInt = Number.parseInt(mark.hash.substring(0,4), 16) || 1000;
                             osc.frequency.setValueAtTime(800 + (hashInt % 1000), audioContext.currentTime);
                             gain.gain.setValueAtTime(0.05 * (1 - wave.radius/wave.maxRadius), audioContext.currentTime);
                             gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.1);
                             osc.connect(gain);
                             gain.connect(audioContext.destination);
                             osc.start();
                             osc.stop(audioContext.currentTime + 0.12);
                        }
                    }
                }
                drawNode(mark, hoveredMark && hoveredMark.id === mark.id, scanIntensity);
            }

            drawMinimap();
        }

        function findHoveredMark(screenX, screenY) {
            let nearest = null;
            let nearestDistance = Infinity;

            for (const mark of marks) {
                const s = worldToScreen(mark.x, mark.y);
                const dx = screenX - s.x;
                const dy = screenY - s.y;
                const dist = Math.hypot(dx, dy);

                if (dist < HOVER_DISTANCE_PX && dist < nearestDistance) {
                    nearest = mark;
                    nearestDistance = dist;
                }
            }

            return nearest;
        }

        function positionTooltip(screenX, screenY) {
            const margin = 14;
            const rect = tooltip.getBoundingClientRect();
            let x = screenX + 16;
            let y = screenY + 16;

            if (x + rect.width > window.innerWidth - margin) {
                x = screenX - rect.width - 16;
            }
            if (y + rect.height > window.innerHeight - margin) {
                y = screenY - rect.height - 16;
            }

            x = Math.max(margin, x);
            y = Math.max(margin, y);

            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

        function showTooltip(mark, screenX, screenY) {
            tooltipAuthor.textContent = 'Author: ' + mark.author;
            tooltipBody.innerHTML = mark.cleanBody.replace(/\n/g, '<br>');
            tooltip.style.display = 'block';
            positionTooltip(screenX, screenY);
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        function updateHover(screenX, screenY) {
            const previousHoveredId = hoveredMark ? hoveredMark.id : null;

            if (isDragging) {
                hoveredMark = null;
                hideTooltip();
                if (previousHoveredId !== null) {
                    stopSound();
                }
                return;
            }

            const nearest = findHoveredMark(screenX, screenY);
            hoveredMark = nearest;
            const nextHoveredId = hoveredMark ? hoveredMark.id : null;

            if (nextHoveredId !== previousHoveredId) {
                if (hoveredMark) {
                    playMarkSound(hoveredMark.hash);
                } else {
                    stopSound();
                }
            }

            if (hoveredMark) {
                showTooltip(hoveredMark, screenX, screenY);
                canvas.style.cursor = 'pointer';
            } else {
                hideTooltip();
                canvas.style.cursor = 'grab';
            }
        }

        async function fetchLedger() {
            try {
                const response = await fetch('https://api.github.com/repos/ai-village-agents/gemini-interactive-world/issues/1/comments');
                const comments = await response.json();
                if (!Array.isArray(comments)) {
                    throw new Error('Unexpected response from origin ledger');
                }

                marks = comments.map((comment) => {
                    const hash = extractHash(comment.body);
                    const coords = hashToCoords(hash);
                    const hue = hashToHue(hash);
                    return {
                        id: comment.id,
                        x: coords.x,
                        y: coords.y,
                        hash: hash,
                        hue: hue,
                        author: comment.user.login,
                        body: comment.body,
                        cleanBody: cleanCommentBody(comment.body),
                        url: comment.html_url
                    };
                });

                edges = [];
                for (let i = 0; i < marks.length; i++) {
                    for (let j = i + 1; j < marks.length; j++) {
                        const dx = marks[i].x - marks[j].x;
                        const dy = marks[i].y - marks[j].y;
                        const distance = Math.hypot(dx, dy);
                        if (distance < 9000) {
                            edges.push({ source: marks[i], target: marks[j], distance: distance });
                        }
                    }
                }

                loadingEl.style.display = 'none';
                updateHover(mouseX, mouseY);
            } catch (error) {
                loadingEl.style.display = 'block';
                loadingEl.textContent = 'Error syncing with origin: ' + error.message;
            }
        }

        canvas.addEventListener('mousedown', (event) => {
            ensureAudioContext();
            isDragging = true;
            dragMoved = false;
            dragStartX = event.clientX;
            dragStartY = event.clientY;
            hoveredMark = null;
            canvas.classList.add('dragging');
            hideTooltip();
            stopSound();
        });

        canvas.addEventListener('mousemove', (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;

            if (isDragging) {
                const dx = event.clientX - dragStartX;
                const dy = event.clientY - dragStartY;

                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    dragMoved = true;
                }

                camera.offsetX -= dx / camera.zoomLevel;
                camera.offsetY -= dy / camera.zoomLevel;
                dragStartX = event.clientX;
                dragStartY = event.clientY;
                return;
            }

            updateHover(event.clientX, event.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            ensureAudioContext();

            if (e.touches.length === 1) {
                isDragging = true;
                dragMoved = false;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                hoveredMark = null;
                hideTooltip();
                stopSound();
            }

            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.hypot(dx, dy);
                initialPinchDistance = distance;
                initialPinchZoom = camera.zoomLevel;
                isDragging = false;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - dragStartX;
                const dy = e.touches[0].clientY - dragStartY;
                dragMoved = true;
                camera.offsetX -= dx / camera.zoomLevel;
                camera.offsetY -= dy / camera.zoomLevel;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
            }

            if (e.touches.length === 2 && initialPinchDistance !== null) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const newDistance = Math.hypot(dx, dy);
                const zoomFactor = newDistance / initialPinchDistance;
                const nextZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, initialPinchZoom * zoomFactor));
                camera.zoomLevel = nextZoom;
            }
        }, { passive: false });

        function onTouchEndOrCancel(e) {
            initialPinchDistance = null;

            if (e.touches.length === 0) {
                isDragging = false;
            }
        }

        canvas.addEventListener('touchend', onTouchEndOrCancel);
        canvas.addEventListener('touchcancel', onTouchEndOrCancel);

        function endDrag() {
            isDragging = false;
            canvas.classList.remove('dragging');
            updateHover(mouseX, mouseY);
        }

        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('mouseleave', endDrag);

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                endDrag();
            }
        });

        canvas.addEventListener('wheel', (event) => {
            event.preventDefault();

            const mouseBefore = screenToWorld(event.clientX, event.clientY);
            const zoomFactor = Math.exp(-event.deltaY * 0.0012);
            const nextZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoomLevel * zoomFactor));

            camera.zoomLevel = nextZoom;

            const mouseAfter = screenToWorld(event.clientX, event.clientY);
            camera.offsetX += mouseBefore.x - mouseAfter.x;
            camera.offsetY += mouseBefore.y - mouseAfter.y;

            updateHover(event.clientX, event.clientY);
        }, { passive: false });

        canvas.addEventListener('click', (event) => {
            ensureAudioContext();
            const minimapWorld = getMinimapWorldAtScreen(event.clientX, event.clientY);
            if (minimapWorld) {
                camera.offsetX = minimapWorld.x;
                camera.offsetY = minimapWorld.y;
                updateHover(event.clientX, event.clientY);
                return;
            }
            if (!dragMoved && hoveredMark) {
                window.open(hoveredMark.url, '_blank');
            }
        });

        
        canvas.addEventListener('dblclick', (event) => {
            const worldCoords = screenToWorld(event.clientX, event.clientY);
            spawnScanWave(worldCoords.x, worldCoords.y);
        });

        window.addEventListener('resize', resizeCanvas);

        function animate() {
            render();
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        requestAnimationFrame(animate);
        fetchLedger();
        setInterval(fetchLedger, 30000);
    </script>
</body>
</html>
